[project]
name = "bird-gepa"
version = "0.1.0"
description = "BIRD SQL experiments with DSPy Flex, GEPA, and Codex"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dspy==3.3.1",
  "gepa==0.1.4",
  "httpx>=0.28,<0.29",
  "litellm>=1.100.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "mypy>=1.16,<2"]

[tool.uv]
# A set of scripts run from the repository, not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: end-to-end Flex and GEPA runs (deselect with -m 'not slow')"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["bird_gepa"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
